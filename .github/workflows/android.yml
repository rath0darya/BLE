name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-main-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APKs
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Prepare downloadable APKs
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/BLE-Explorer-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk downloads/BLE-Explorer-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BLE-Explorer-APKs
          path: downloads/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish rolling GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "BLE Explorer latest build" --notes "Automatically built from main. Debug APK is signed for direct installation; release APK is unsigned unless a signing key is configured."
          gh release upload latest downloads/BLE-Explorer-debug.apk downloads/BLE-Explorer-release-unsigned.apk --clobber
