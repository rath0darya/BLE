name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  packages: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: ble-android-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare persistent release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.3.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release-key.jks"
            test -s "$GITHUB_WORKSPACE/release-key.jks"
            chmod 600 "$GITHUB_WORKSPACE/release-key.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-key.jks" >> "$GITHUB_ENV"
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
            echo "Persistent release key found."
          else
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Persistent signing secrets are missing. Building a debug validation APK only; no installable release will be published."
          fi
      - name: Build signed release and debug APKs
        if: steps.signing.outputs.release_ready == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease
      - name: Build debug validation APK only
        if: steps.signing.outputs.release_ready != 'true'
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publish APK to GitHub Packages
        if: false
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle --no-daemon publishReleaseApkPublicationToGitHubPackagesRepository
      - name: Prepare downloadable APK
        run: |
          mkdir -p downloads
          if [ "${{ steps.signing.outputs.release_ready }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk downloads/BLE-Explorer.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk downloads/BLE-Explorer-DEBUG-VALIDATION-ONLY.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BLE-Explorer-${{ steps.signing.outputs.release_ready == 'true' && 'release' || 'debug-validation-only' }}
          path: downloads/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish debug validation APK to Releases (not an install-over update)
        if: false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: validation-v1.3.${{ github.run_number }}
          name: BLE Explorer v1.3.${{ github.run_number }} — Debug validation
          prerelease: true
          make_latest: false
          body: |
            **DEBUG VALIDATION BUILD — NOT A SIGNED PRODUCTION RELEASE**

            This APK is published so the latest build is available on the Releases page while persistent signing credentials are unavailable.
            It is signed with the temporary GitHub Actions debug key and is intended for fresh-install testing only. It cannot reliably update an existing installation and must not replace the signed production APK.
            Package: com.anonvox.bleexplorer
          files: downloads/BLE-Explorer-DEBUG-VALIDATION-ONLY.apk
      - name: Remove superseded app releases
        if: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --yes --cleanup-tag
          done
      - name: Publish installable versioned GitHub Release
        if: false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: BLE Explorer v1.3.${{ github.run_number }}
          body: "BLE Explorer Android app · v1.3.${{ github.run_number }} · Signed APK · com.anonvox.bleexplorer"
          overwrite_files: true
          make_latest: true
          files: downloads/BLE-Explorer.apk

  deploy-pages:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
