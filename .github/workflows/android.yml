name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ble-android-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APKs
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease
      - name: Prepare downloadable APKs
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/BLE-Explorer-debug.apk
          cp app/build/outputs/apk/release/app-release.apk downloads/BLE-Explorer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BLE-Explorer-APKs
          path: downloads/*.apk
          if-no-files-found: error
          retention-days: 30
